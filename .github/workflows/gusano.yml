# Genera el gusanito que se come el gráfico de contribuciones (datos reales de GitHub)
# y el relieve de contribuciones. El relieve va primero porque el gusanito escribe dist/ como root.
# Corre todos los días y cuando cambia este archivo o el script.
name: gusanito de contribuciones

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/gusano.yml", "scripts/relieve.py"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dibujar el relieve
        run: python3 scripts/relieve.py dist/relieve.svg
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Generar el gusanito
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/gusano-dark.svg?color_snake=#E2B04B&color_dots=#132320,#1E3A33,#3E6B5A,#5E8574,#8DB89C
            dist/gusano.svg?color_snake=#B8862B&color_dots=#ebedf0,#c6dccf,#8DB89C,#5E8574,#2F5446

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
