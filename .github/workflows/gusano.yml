# Genera el metrocable de mis contribuciones (scripts/contribuciones.py) con datos reales de GitHub
# y la publica en la rama output. Corre todos los días y cuando cambia este archivo o el script.
name: metrocable de contribuciones

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/gusano.yml", "scripts/contribuciones.py"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dibujar las contribuciones en 3D
        run: python3 scripts/contribuciones.py dist/contribuciones.svg
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
