# Genera el "relieve de contribuciones": el gráfico de contribuciones del último año
# dibujado como una cordillera (scripts/relieve.py). Corre todos los días y cuando cambia el script.
name: relieve de contribuciones

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/relieve.py", ".github/workflows/gusano.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Dibujar el relieve
        run: python3 scripts/relieve.py dist/relieve.svg
        env:
          GH_USER: ${{ github.repository_owner }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
