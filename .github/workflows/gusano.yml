# Genera el gusano que se come el gráfico de contribuciones (datos reales de GitHub).
# Corre todos los días y cada vez que se edita este archivo; también se puede lanzar a mano.
name: gusano de contribuciones

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/gusano.yml"]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar SVG del gusano
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/gusano.svg?color_snake=#F778BA&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/gusano-dark.svg?color_snake=#F778BA&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
