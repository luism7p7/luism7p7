<title>Ver portafolio</title>
<style>
@font-face{font-family:G;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:G,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#DCE3DF}
.s{font-family:S,Georgia,serif;font-weight:400}
.b{font-weight:600}
.m{fill:#9DB0A8}
.a{fill:#A8D5BF}
/* Emil: curvas propias y nunca ease-in. Entradas con ease-out fuerte; lo que ya está en pantalla se mueve con ease-in-out. */
.r{animation:rise .8s cubic-bezier(.23,1,.32,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(.23,1,.32,1) infinite}
@keyframes pulse{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
